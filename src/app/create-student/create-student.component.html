<!-- src/app/create-student/create-student.component.html -->

<header class="form-header">
  <h1>Create Student</h1>
</header>

<main class="form-container">
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="createStudent()">

    <label>
      First Name
      <input type="text" [(ngModel)]="student.firstName" name="firstName" required />
    </label>

    <label>
      Last Name
      <input type="text" [(ngModel)]="student.lastName" name="lastName" required />
    </label>

    <label>
      Email
      <input type="email" [(ngModel)]="student.email" name="email" required />
    </label>

    <label>
      Age
      <input type="number" [(ngModel)]="student.age" name="age" />
    </label>

    <label>
      Course
      <input type="text" [(ngModel)]="student.course" name="course" />
    </label>

    <label>
      GPA
      <input type="text" [(ngModel)]="student.gpa" name="gpa" />
    </label>

    <label>
      Year Level
      <input type="text" [(ngModel)]="student.yearLevel" name="yearLevel" />
    </label>

    <label>
      Enrollment Status
      <select [(ngModel)]="student.status" name="status" required>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </label>

    <div class="actions">
      <a routerLink="/students" class="back-btn">Back</a>
      <button type="submit" class="create-btn" [disabled]="isLoading">
        {{ isLoading ? 'Creating...' : 'Create Student' }}
      </button>
    </div>

  </form>
</main>
